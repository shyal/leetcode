[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E402",  # scripts put sys.path setup before their imports
    "E501",  # line length is black's job
    "E731",  # lambda assignment
    "E741",  # single-letter names l, I, O
    "B007",  # unused loop variable
    "B905",  # zip without strict=
]

[tool.ruff.lint.per-file-ignores]
"utils/harness/sitecustomize.py" = ["F401", "F403", "F405", "F811"]
"dsa/monotonic_stack_problems/monotonic_stack_scene.py" = ["F403", "F405"]  # from manim import *

[tool.ruff.lint.isort]
known-first-party = ["kg", "history", "readme"]

[tool.mypy]
python_version = "3.10"
mypy_path = "utils:utils/harness"
explicit_package_bases = true
scripts_are_modules = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["utils/tests"]
pythonpath = ["utils/harness", "utils"]

[tool.coverage.run]
source = ["utils/kg", "utils/harness", "utils/history", "utils/readme"]
omit = ["utils/kg/kg_*_rs/*"]

[tool.coverage.report]
# the floor is where coverage stood when the gate went in; raise it, never lower it
fail_under = 35
skip_covered = true
