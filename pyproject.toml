# Tool configuration only; the repo is not a package. The gates run on utils/
# and dsa/. solved/ and drills/ are reps, not code under maintenance, and
# every name sitecustomize injects would read as undefined there.
# `make check` runs all of them; see the makefile.

[tool.black]
line-length = 88
extend-exclude = "/(solved|drills|research|stubs|utils/attic)/"

[tool.ruff]
line-length = 88
extend-exclude = ["solved", "drills", "research", "stubs", "utils/attic", "current.py"]
# the names utils/harness/sitecustomize.py injects into builtins;
