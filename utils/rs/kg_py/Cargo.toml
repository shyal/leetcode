[package]
name = "kg_py"
version = "0.1.0"
edition = "2021"

# kg_rs: the kg library as a Python extension module, so utils/kg/kg_lib.py
# hands functions over to Rust one at a time while its callers and the
# pytest suite keep running unchanged. `make ext` builds and installs it.
[lib]
name = "kg_rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
kg = { path = "../kg" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[build-dependencies]
pyo3-build-config = "0.29"
