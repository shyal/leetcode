# The Rust tooling: one workspace, one library (kg), one binary per make
# target. `cargo build --release` here builds every binary into
# utils/rs/target/release/. The makefile's `make rust` runs fmt, clippy and
# the tests over the whole workspace.
[workspace]
resolver = "2"
members = ["kg", "estimate", "kg_chat", "kg_dependents", "kg_gaps", "kg_mock", "kg_movie", "kg_next", "kg_py", "kg_rep", "kg_status", "kg_viz", "is_session_start"]

[workspace.dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = "2"
regex = "1"
uuid = { version = "1", features = ["v5"] }

[profile.release]
lto = true
