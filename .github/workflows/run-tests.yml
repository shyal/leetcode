name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy custom sitecustomize.py
        run: |
          source venv/bin/activate
          cp utils/sitecustomize.py $(python -c "import site; print(site.getsitepackages()[0])")

      - name: Run pytest via runner
        run: |
          source venv/bin/activate
          PYTHONPATH=./utils:./utils/ pytest
