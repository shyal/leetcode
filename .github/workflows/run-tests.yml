name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Every job is one target of `make check` (see the makefile); a red job names
# the gate. The pytest job is the full suite including the 988-solve sweep.

jobs:
  python-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [fmt-check, lint, types, complexity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
      - name: make ${{ matrix.gate }}
        run: make ${{ matrix.gate }}

  duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make duplicates

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make rust
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --quiet
          make audit

  pytest:
    runs-on: ubuntu-latest
    steps:
      # the whole history: kg_simulate reads the solve-time trailers and the
      # bank's growth from the git log, and a depth-1 checkout hands it a
      # bank that appears all at once today (two starvation guards went red
      # on 2026-09-11 for that alone)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up Java (pyspark drills run a local JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt
          cp utils/harness/sitecustomize.py .venv/lib/python3.10/site-packages/
      - name: Build the Rust binaries the golden tests diff against
        run: |
          cargo build --release --quiet --manifest-path utils/rs/Cargo.toml
      - name: pytest with the coverage floor
        run: .venv/bin/pytest --cov --cov-report=term
