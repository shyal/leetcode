    <text x="1045" y="662">3<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6143;0.625;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="1190" y="662">5<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7214;0.7321;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="1335" y="662">6<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8286;0.8393;1" dur="14s" repeatCount="indefinite"/></text>
