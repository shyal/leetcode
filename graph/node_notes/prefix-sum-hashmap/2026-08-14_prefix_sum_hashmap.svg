    <text x="465" y="312">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1643;0.175;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="610" y="312">3<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2714;0.2821;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="755" y="312">6<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3786;0.3893;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="900" y="312">10<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4857;0.4964;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="1045" y="312">13<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5929;0.6036;1" dur="14s" repeatCount="indefinite"/></text>
