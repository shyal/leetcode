    <line x1="465" y1="105" x2="465" y2="150" stroke="#7ee787" stroke-width="5" stroke-linecap="round" marker-end="url(#ptr)"/>
  </g>

  <!-- nums row (static input) -->
  <text x="60" y="215" fill="#e8963c" font-size="34" letter-spacing="8">NUMS</text>
  <g fill="#e8963c" font-size="44" text-anchor="middle">
