    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.107;0.118;0.914;0.925;1" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="linear"
      values="0 0;0 0;145 0;145 0;290 0;290 0;435 0;435 0;580 0;580 0;725 0;725 0;870 0;870 0"
