    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.8607;1" dur="14s" repeatCount="indefinite"/>
      <path d="M 1320 622 C 1120 545, 850 490, 758 414"/></g>
  </g>

  <!-- prefix - k row -->
  <text x="90" y="660" fill="#e06a6a" font-size="30" letter-spacing="4">PREFIX - k</text>
  <g fill="#e06a6a" font-size="36" text-anchor="middle">
    <text x="465" y="662">-9<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1857;0.1964;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="610" y="662">-7<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2929;0.3036;1" dur="14s" repeatCount="indefinite"/></text>
