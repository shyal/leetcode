    <text x="632" y="240">1</text>
    <text x="777" y="240">2</text>
    <text x="922" y="240">3</text>
    <text x="1067" y="240">4</text>
    <text x="1212" y="240">5</text>
    <text x="1357" y="240">6</text>
  </g>

