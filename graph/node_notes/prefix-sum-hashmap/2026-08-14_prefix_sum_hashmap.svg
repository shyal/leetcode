    <text x="610" y="215">2</text>
    <text x="755" y="215">3</text>
    <text x="900" y="215">4</text>
    <text x="1045" y="215">3</text>
    <text x="1190" y="215">2</text>
    <text x="1335" y="215">1</text>
  </g>
  <g fill="#e8d44d" font-size="22" text-anchor="middle">
