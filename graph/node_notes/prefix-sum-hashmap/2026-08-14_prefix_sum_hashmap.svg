  <g fill="#e06a6a" font-size="34" text-anchor="middle">
    <text x="320" y="384">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0714;0.0821;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="465" y="384">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2286;0.2393;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="610" y="384">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3357;0.3464;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="755" y="384">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4429;0.4536;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="900" y="384">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5714;0.5821;1" dur="14s" repeatCount="indefinite"/></text>
