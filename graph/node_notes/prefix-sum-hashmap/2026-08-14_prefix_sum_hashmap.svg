    <text x="1190" y="384">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7643;0.775;1" dur="14s" repeatCount="indefinite"/></text>
    <text x="1335" y="384">1<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8929;0.9036;1" dur="14s" repeatCount="indefinite"/></text>
  </g>

  <!-- lookup arrows: prefix-k value found in D -->
  <g stroke="#2979ff" stroke-width="5" fill="none" marker-end="url(#arrow)" stroke-linecap="round">
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5286;0.5393;1" dur="14s" repeatCount="indefinite"/>
      <path d="M 880 615 C 620 590, 380 520, 322 410"/></g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6357;0.6464;1" dur="14s" repeatCount="indefinite"/>
