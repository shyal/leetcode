<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1670 750" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2979ff"/>
    </marker>
    <marker id="ptr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee787"/>
    </marker>
  </defs>

  <!-- k -->
  <text x="1480" y="70" fill="#e8d44d" font-size="42" letter-spacing="6">k = 10</text>

  <!-- iteration pointer -->
